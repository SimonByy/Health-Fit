<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#1D3270"/>
      <stop offset="0.55" stop-color="#0E1A3D"/>
      <stop offset="1" stop-color="#070E22"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3FD5FF"/>
      <stop offset="0.45" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#C77DFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- zachte gloed achter de ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#5B8CFF" stroke-opacity="0.18" stroke-width="150"/>
  <!-- spoor van de ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="88"/>
  <!-- ring ~ 82 % gevuld, start bovenaan -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="88" stroke-linecap="round"
          stroke-dasharray="1545 1885" transform="rotate(-90 512 512)" filter="url(#glow)"/>
  <!-- hartslaglijn -->
  <polyline points="300,540 400,540 445,450 505,640 560,390 610,540 724,540"
            fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
